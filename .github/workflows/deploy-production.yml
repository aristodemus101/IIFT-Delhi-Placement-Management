name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_KEY: ${{ secrets.VITE_GEMINI_KEY }}

      - name: Deploy to Firebase (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
          projectId: placement-management-6133f
          channelId: live

      - name: Generate version tag
        id: version
        run: |
          # Auto-increment patch version based on number of releases
          COUNT=$(git tag --list 'v*' | wc -l | tr -d ' ')
          MAJOR=1
          MINOR=0
          PATCH=$((COUNT + 1))
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag, or last 20 if no tags yet
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" -20)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **Deployed to:** https://iiftd-pc.web.app

            **Changes in this release:**
            ${{ steps.changelog.outputs.commits }}

            ---
            To roll back: go to [Firebase Console → Hosting](https://console.firebase.google.com/project/placement-management-6133f/hosting/sites) and click **Release history** → select previous version → **Rollback**.
